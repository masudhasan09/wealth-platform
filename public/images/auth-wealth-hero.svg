<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="640" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071318"/>
      <stop offset="55%" stop-color="#0B2527"/>
      <stop offset="100%" stop-color="#0F4C46"/>
    </linearGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chartArea" x1="0" y1="150" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="btcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="ethGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="usdGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="640" height="420" rx="24" fill="url(#bgGrad)"/>
  <circle cx="320" cy="190" r="220" fill="url(#glowEmerald)"/>
  <circle cx="485" cy="120" r="110" fill="url(#glowGold)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1">
    <line x1="60" y1="90" x2="580" y2="90"/>
    <line x1="60" y1="150" x2="580" y2="150"/>
    <line x1="60" y1="210" x2="580" y2="210"/>
    <line x1="60" y1="270" x2="580" y2="270"/>
    <line x1="60" y1="330" x2="580" y2="330"/>
  </g>

  <!-- Main Glass Portfolio Card -->
  <rect x="64" y="88" width="380" height="250" rx="20" fill="url(#cardGlass)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Card Header Pills -->
  <rect x="90" y="114" width="118" height="24" rx="12" fill="#10B981" fill-opacity="0.22" stroke="#34D399" stroke-opacity="0.45"/>
  <circle cx="106" cy="126" r="4" fill="#34D399"/>
  <text x="118" y="130" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">MULTI-ASSET</text>

  <text x="90" y="168" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, monospace" font-size="28" font-weight="700">$248,920.40</text>
  <text x="292" y="164" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">+18.4% YTD</text>

  <!-- Area Chart inside Card -->
  <path d="M90 296 L90 260 C125 258 145 225 182 232 C220 240 242 195 282 204 C322 212 346 175 416 170 L416 296 Z" fill="url(#chartArea)"/>
  <path d="M90 260 C125 258 145 225 182 232 C220 240 242 195 282 204 C322 212 346 175 416 170" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <circle cx="416" cy="170" r="6" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>

  <!-- Mini Bar Chart Accent -->
  <g fill="#5EEAD4" fill-opacity="0.45">
    <rect x="94" y="306" width="22" height="12" rx="4"/>
    <rect x="124" y="302" width="22" height="16" rx="4"/>
    <rect x="154" y="298" width="22" height="20" rx="4"/>
    <rect x="184" y="304" width="22" height="14" rx="4"/>
    <rect x="214" y="294" width="22" height="24" rx="4" fill="#34D399" fill-opacity="0.85"/>
  </g>

  <!-- Floating Bitcoin Coin (Top Right) -->
  <g transform="translate(472, 95)">
    <circle cx="46" cy="46" r="46" fill="url(#btcGrad)" stroke="#FDE68A" stroke-width="2.5"/>
    <circle cx="46" cy="46" r="37" fill="none" stroke="#FFFBEB" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="46" y="59" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800">&#x20BF;</text>
  </g>

  <!-- Floating Dollar / Money Coin (Middle Right) -->
  <g transform="translate(415, 226)">
    <circle cx="40" cy="40" r="40" fill="url(#usdGrad)" stroke="#A7F3D0" stroke-width="2.5"/>
    <circle cx="40" cy="40" r="32" fill="none" stroke="#ECFDF5" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="40" y="51" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800">$</text>
  </g>

  <!-- Floating Ethereum / Crypto Diamond Badge (Bottom Right) -->
  <g transform="translate(502, 238)">
    <rect x="0" y="0" width="84" height="84" rx="22" fill="url(#ethGrad)" stroke="#DDD6FE" stroke-width="2"/>
    <polygon points="42,16 62,43 42,54 22,43" fill="#FFFFFF" fill-opacity="0.92"/>
    <polygon points="42,58 62,47 42,70 22,47" fill="#EDE9FE" fill-opacity="0.85"/>
  </g>

  <!-- Floating Equity & Bond Pill (Bottom Left) -->
  <g transform="translate(88, 352)">
    <rect x="0" y="0" width="166" height="36" rx="18" fill="#111827" fill-opacity="0.82" stroke="#34D399" stroke-opacity="0.4"/>
    <circle cx="20" cy="18" r="5" fill="#60A5FA"/>
    <text x="34" y="22" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Equities &amp; Treasuries</text>
  </g>

  <!-- Floating Crypto & Real Estate Pill (Bottom Center) -->
  <g transform="translate(272, 352)">
    <rect x="0" y="0" width="176" height="36" rx="18" fill="#111827" fill-opacity="0.82" stroke="#FBBF24" stroke-opacity="0.45"/>
    <circle cx="20" cy="18" r="5" fill="#FBBF24"/>
    <text x="34" y="22" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Crypto &amp; Real Estate</text>
  </g>
</svg>
